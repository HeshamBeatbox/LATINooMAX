<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LATINooMAX | كافيه ومطعم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:#141312;--line:#2a2620;--gold:#cfa24a;--gold2:#e8c779;--text:#f3ede2;--mute:#9d9486;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,Tahoma,Arial,sans-serif;padding-bottom:84px;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.14;z-index:0;pointer-events:none}
body::before{background:var(--gold2);top:-20vmax;right:-20vmax;animation:float1 18s ease-in-out infinite}
body::after{background:var(--gold);bottom:-25vmax;left:-20vmax;animation:float2 22s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-6vmax,8vmax) scale(1.15)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,-6vmax) scale(1.1)}}
.wrap,.top,.hero,header{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);max-width:720px;margin:0 auto}
.top img{width:44px;height:44px;border-radius:50%}
.top b{font-size:17px;letter-spacing:.5px;color:var(--gold2)}
.hero{position:relative;max-width:720px;margin:0 auto}
.hero img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;animation:zoomIn 1.2s ease}
@keyframes zoomIn{from{transform:scale(1.08);opacity:.6}to{transform:none;opacity:1}}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,var(--bg))}
header{text-align:center;padding:0 0 8px;margin-top:-26px;position:relative;z-index:1}
header p{color:var(--mute);margin:0 0 14px}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;border:1px solid var(--gold);color:var(--gold);background:transparent;padding:10px 16px;border-radius:10px;font:700 15px Cairo,Tahoma,sans-serif;text-decoration:none;cursor:pointer;transition:transform .15s ease}
.btn:active{transform:scale(.96)}
.btn.fill{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#17110a;border-color:transparent;box-shadow:0 2px 14px rgba(207,162,74,.25)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 0 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:99px;font:700 14px Cairo,Tahoma,sans-serif;cursor:pointer}
.tab.on{background:var(--gold);color:#17110a;border-color:var(--gold)}
h2{font-size:18px;color:var(--gold);margin:20px 0 8px}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;transition:border-color .2s;animation:rise .4s ease backwards}
.item:hover{border-color:var(--gold)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.item h3{margin:0 0 2px;font-size:16px}
.item small{color:var(--mute);display:block;font-size:13px}
.price{color:var(--gold);font-weight:800;margin-top:4px}
.qty{display:flex;align-items:center;gap:8px;flex:none}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:20px;line-height:1;cursor:pointer}
.qty button.add{background:var(--gold);color:#17110a}
.qty span{min-width:18px;text-align:center;font-weight:700}
#bar{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--gold);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:none;z-index:10}
#bar .in{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:20;overflow-y:auto;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#sheet .box{max-width:560px;margin:24px auto;background:var(--bg);border:1px solid var(--gold);border-radius:16px;padding:18px;animation:slideUp .25s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
label{display:block;margin:12px 0 4px;font-size:14px;color:var(--mute)}
input,textarea{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:16px Cairo,Tahoma,sans-serif}
.tot{font-weight:800;font-size:17px;margin-top:10px;display:flex;justify-content:space-between}
footer{margin-top:28px;padding:20px 0 12px;border-top:1px solid var(--line);text-align:center;color:var(--mute);font-size:14px}
footer .cta{margin-bottom:12px}

.hero{display:block;overflow:visible}
.hero img{aspect-ratio:3/2;-webkit-mask-image:radial-gradient(ellipse 78% 74% at 50% 46%,#000 52%,transparent 100%);mask-image:radial-gradient(ellipse 78% 74% at 50% 46%,#000 52%,transparent 100%);animation:kb 22s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.hero::after{display:none}
.hero-in{position:relative;z-index:2;text-align:center;padding:0 16px 8px;margin-top:-46px}
.hero-in p{color:var(--mute);margin:0 0 14px}
.item{background:rgba(20,19,18,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tabs{background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

.waves{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.waves .w{position:absolute;left:0;width:200%;height:58vh;filter:blur(1.2px)}
.waves .w1{bottom:-6vh;opacity:.22;animation:wv 17s linear infinite}
.waves .w2{bottom:8vh;opacity:.13;animation:wv 26s linear infinite reverse}
.waves .w3{bottom:-14vh;opacity:.18;animation:wv 12s linear infinite}
@keyframes wv{to{transform:translateX(-50%)}}
</style>
</head>

<div id="bar"><div class="in"><div><b id="cnt">0</b> صنف · <b id="sum">0</b> ج</div><button class="btn fill" id="open">كمّل الطلب</button></div></div>

<div id="sheet"><div class="box">
<h2 style="margin-top:0">طلبك</h2>
<div id="lines"></div>
<div class="row"><span>مصاريف التوصيل</span><span id="dl"></span></div>
<div class="tot"><span>الإجمالي</span><span id="all"></span></div>
<label>الاسم</label><input id="nm" autocomplete="name">
<label>رقم التليفون</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel">
<label>العنوان بالتفصيل</label><textarea id="ad" rows="2"></textarea>
<label>ملاحظات (اختياري)</label><textarea id="nt" rows="2"></textarea>
<div class="cta" style="margin-top:16px"><button class="btn fill" id="send">ابعت الطلب على واتساب</button><button class="btn" id="close">رجوع</button></div>
<p id="err" style="color:#ff8a7a;margin:8px 0 0;font-size:14px"></p>
</div></div>

<script>
// ===== إعدادات المطعم — عدّلها هنا =====
const CFG={
  name:"LATINooMAX",
  whatsapp:"201501197488",   // رقم الواتساب بصيغة دولية بدون + (مثال مصر: 20 + الرقم بدون صفر)
  phone:"+201501197488",
  instagram:"https://instagram.com/",
  facebook:"https://facebook.com/",
  address:"العنوان هنا",
  delivery:20,
  currency:"ج"
};
// ===== المينيو (أمثلة — هنبدلها بالمينيو الحقيقي) =====
const CATS=["برجر","بيتزا","مشويات","مشروبات ساخنة","مشروبات باردة","حلويات"];
const ITEMS=[
["برجر","كلاسيك برجر","لحم بلدي، جبنة شيدر، خس، طماطم",110],
["برجر","دبل تشيز برجر","قطعتين لحم، جبنة مضاعفة، صوص خاص",150],
["برجر","تشيكن كرنشي","فراخ مقرمشة، كولسلو، مايو",120],
["بيتزا","مارجريتا","صوص طماطم، موتزاريلا، ريحان",110],
["بيتزا","بيتزا خضار","فلفل، مشروم، زيتون، موتزاريلا",125],
["بيتزا","بيتزا مشكل لحوم","مشكل لحوم مع جبنة موتزاريلا",160],
["مشويات","ميكس جريل","فراخ وكفتة وشيش طاووق مع أرز وسلطة",240],
["مشويات","شيش طاووق","مع بطاطس وتومية",170],
["مشروبات ساخنة","إسبريسو","",45],
["مشروبات ساخنة","كابتشينو","",60],
["مشروبات ساخنة","لاتيه","",65],
["مشروبات باردة","آيس كوفي","",70],
["مشروبات باردة","ليمون نعناع","",50],
["مشروبات باردة","ميلك شيك","شوكولاتة / فانيليا / فراولة",80],
["حلويات","تشيز كيك","",85],
["حلويات","براونيز بالآيس كريم","",90]
].map((x,i)=>({id:i,cat:x[0],name:x[1],desc:x[2],price:x[3]}));

const $=id=>document.getElementById(id);
const cart={};let tab="الكل";
$("callTop").href="tel:"+CFG.phone;
$("waTop").href="https://wa.me/"+CFG.whatsapp;
$("ig").href=CFG.instagram;$("fb").href=CFG.facebook;
$("addr").textContent="📍 "+CFG.address+" · 📞 "+CFG.phone;
const money=n=>n+" "+CFG.currency;

function renderTabs(){
  $("tabs").innerHTML=["الكل",...CATS].map(c=>`<button class="tab${c===tab?" on":""}" data-t="${c}">${c}</button>`).join("");
}
function renderMenu(){
  const cats=tab==="الكل"?CATS:[tab];
  $("menu").innerHTML=cats.map(c=>{
    const list=ITEMS.filter(i=>i.cat===c);
    if(!list.length)return"";
    return`<h2>${c}</h2>`+list.map(i=>{
      const q=cart[i.id]||0;
      return`<div class="item"><div><h3>${i.name}</h3>${i.desc?`<small>${i.desc}</small>`:""}<div class="price">${money(i.price)}</div></div>
      <div class="qty">${q?`<button data-m="${i.id}">−</button><span>${q}</span>`:""}<button class="add" data-p="${i.id}">+</button></div></div>`;
    }).join("");
  }).join("");
}
function totals(){
  let n=0,s=0;
  for(const id in cart){n+=cart[id];s+=cart[id]*ITEMS[id].price}
  return{n,s};
}
function update(){
  const{n,s}=totals();
  $("cnt").textContent=n;$("sum").textContent=s;
  $("bar").style.display=n?"block":"none";
  renderMenu();
  if($("sheet").style.display==="block")renderSheet();
}
function renderSheet(){
  const{s}=totals();
  $("lines").innerHTML=Object.keys(cart).map(id=>`<div class="row"><span>${cart[id]} × ${ITEMS[id].name}</span><span>${money(cart[id]*ITEMS[id].price)}</span></div>`).join("");
  $("dl").textContent=money(CFG.delivery);
  $("all").textContent=money(s+CFG.delivery);
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-t],[data-p],[data-m]");
  if(!t)return;
  if(t.dataset.t){tab=t.dataset.t;renderTabs();renderMenu();return}
  if(t.dataset.p){const id=t.dataset.p;cart[id]=(cart[id]||0)+1}
  if(t.dataset.m){const id=t.dataset.m;cart[id]--;if(cart[id]<=0)delete cart[id];if(!Object.keys(cart).length)$("sheet").style.display="none"}
  update();
});
$("open").onclick=()=>{renderSheet();$("sheet").style.display="block"};
$("close").onclick=()=>{$("sheet").style.display="none"};
$("send").onclick=()=>{
  const nm=$("nm").value.trim(),ph=$("ph").value.trim(),ad=$("ad").value.trim();
  if(!nm||!ph||!ad){$("err").textContent="من فضلك اكتب الاسم ورقم التليفون والعنوان.";return}
  $("err").textContent="";
  const{s}=totals();
  let m=`طلب جديد من موقع ${CFG.name}\n\n`;
  for(const id in cart)m+=`• ${cart[id]} × ${ITEMS[id].name} — ${money(cart[id]*ITEMS[id].price)}\n`;
  m+=`\nمصاريف التوصيل: ${money(CFG.delivery)}\nالإجمالي: ${money(s+CFG.delivery)}\n\nالاسم: ${nm}\nالتليفون: ${ph}\nالعنوان: ${ad}`;
  const nt=$("nt").value.trim();if(nt)m+=`\nملاحظات: ${nt}`;
  const a=document.createElement("a");
  a.href="https://wa.me/"+CFG.whatsapp+"?text="+encodeURIComponent(m);
  a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
};
renderTabs();renderMenu();
</script>
